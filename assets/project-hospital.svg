<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 210" width="900" height="210">
  <defs>
    <!-- Left accent bar gradient -->
    <linearGradient id="projAccentGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2F5D3A" />
      <stop offset="100%" stop-color="#3E7B4F" />
    </linearGradient>

    <!-- Bottom sliding line gradient -->
    <linearGradient id="slideLineGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2F5D3A" stop-opacity="0" />
      <stop offset="50%" stop-color="#3E7B4F" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#2F5D3A" stop-opacity="0" />
    </linearGradient>

    <clipPath id="cardClip1">
      <rect x="0" y="0" width="900" height="210" rx="14" ry="14" />
    </clipPath>
  </defs>

  <style>
    .project-mono {
      font-family: Consolas, 'Courier New', Courier, monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2.2px;
      fill: #3E7B4F;
    }
    .project-title {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 22px;
      font-weight: 700;
      fill: #2F5D3A;
    }
    .project-desc {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-size: 13px;
      fill: #6B6B5A;
    }
    .chip-outline {
      fill: #ECE6D5;
      stroke: #3E7B4F;
      stroke-width: 1.2;
    }
    .chip-text {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-size: 11px;
      font-weight: 600;
      fill: #2F5D3A;
      text-anchor: middle;
      dominant-baseline: middle;
    }
    .watermark-num {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 130px;
      font-weight: 900;
      fill: #2F5D3A;
      opacity: 0.07;
      text-anchor: middle;
      user-select: none;
    }
  </style>

  <!-- Card Background clipped -->
  <g clip-path="url(#cardClip1)">
    <rect x="0" y="0" width="900" height="210" fill="#F5F0E1" stroke="#D9D2BC" stroke-width="2" rx="14" />
    
    <!-- Left Accent Bar -->
    <rect x="0" y="0" width="6" height="210" fill="url(#projAccentGrad1)" />

    <!-- Huge Faded Number on Right -->
    <text x="785" y="152" class="watermark-num">01</text>

    <!-- Thin Animated Bottom Edge Line -->
    <rect y="207" height="3" fill="url(#slideLineGrad1)" rx="1.5">
      <animate attributeName="x" values="-240; 900" dur="4.2s" repeatCount="indefinite" />
      <animate attributeName="width" values="120; 260; 120" dur="4.2s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Project Content -->
  <g id="project-content">
    <!-- Mono Label -->
    <text x="42" y="40" class="project-mono">PROJECT 01</text>

    <!-- Title -->
    <text x="42" y="72" class="project-title">Hospital Management System</text>

    <!-- Description -->
    <text x="42" y="97" class="project-desc">Full-stack healthcare management with role-based access control and patient-doctor scheduling.</text>

    <!-- Feature Chips (Row 1) -->
    <g transform="translate(42, 120)">
      <!-- JWT Authentication -->
      <g transform="translate(0, 0)">
        <rect width="136" height="24" rx="12" class="chip-outline" />
        <text x="68" y="13" class="chip-text">JWT Authentication</text>
      </g>
      <!-- RBAC -->
      <g transform="translate(144, 0)">
        <rect width="56" height="24" rx="12" class="chip-outline" />
        <text x="28" y="13" class="chip-text">RBAC</text>
      </g>
      <!-- Three roles (Admin, Doctor, Receptionist) -->
      <g transform="translate(208, 0)">
        <rect width="256" height="24" rx="12" class="chip-outline" />
        <text x="128" y="13" class="chip-text">Three Roles: Admin, Doctor, Receptionist</text>
      </g>
    </g>

    <!-- Feature Chips (Row 2) -->
    <g transform="translate(42, 152)">
      <!-- Doctor management -->
      <g transform="translate(0, 0)">
        <rect width="138" height="24" rx="12" class="chip-outline" />
        <text x="69" y="13" class="chip-text">Doctor Management</text>
      </g>
      <!-- Patient management -->
      <g transform="translate(146, 0)">
        <rect width="138" height="24" rx="12" class="chip-outline" />
        <text x="69" y="13" class="chip-text">Patient Management</text>
      </g>
      <!-- Appointment management -->
      <g transform="translate(292, 0)">
        <rect width="168" height="24" rx="12" class="chip-outline" />
        <text x="84" y="13" class="chip-text">Appointment Management</text>
      </g>
    </g>
  </g>
</svg>

