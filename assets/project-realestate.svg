<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 210" width="900" height="210">
  <defs>
    <!-- Bottom sliding line gradient -->
    <linearGradient id="slideLineGrad4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F00016" stop-opacity="0" />
      <stop offset="50%" stop-color="#F00016" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#B22731" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    .project-mono {
      font-family: Consolas, 'Courier New', Courier, monospace;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2.2px;
      fill: #F00016;
    }
    .project-title {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-size: 21px;
      font-weight: 800;
      fill: #161111;
    }
    .project-desc {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-size: 13px;
      fill: #555050;
    }
    .chip-accent {
      fill: #FDE8E9;
      stroke: #F00016;
      stroke-width: 1.2;
    }
    .chip-accent-text {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-size: 11px;
      font-weight: 700;
      fill: #B22731;
      text-anchor: middle;
      dominant-baseline: middle;
    }
    .chip-outline {
      fill: #EFE9D9;
      stroke: #2E2828;
      stroke-width: 1.2;
    }
    .chip-text {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      font-size: 11px;
      font-weight: 600;
      fill: #161111;
      text-anchor: middle;
      dominant-baseline: middle;
    }
    .watermark-num {
      font-family: 'Segoe UI', Impact, sans-serif;
      font-size: 120px;
      font-weight: 900;
      fill: #161111;
      opacity: 0.12;
      text-anchor: middle;
      user-select: none;
    }
  </style>

  <!-- Sharp Card Background without border radius or left red line -->
  <rect x="0" y="0" width="900" height="210" fill="#F4EEDF" stroke="#D9D2BC" stroke-width="2" />

  <!-- Number Watermark (no background circle) -->
  <text x="785" y="148" class="watermark-num">04</text>

  <!-- Thin Animated Bottom Edge Line -->
  <rect y="207" height="3" fill="url(#slideLineGrad4)">
    <animate attributeName="x" values="-240; 900" dur="4.2s" begin="2.4s" repeatCount="indefinite" />
    <animate attributeName="width" values="120; 260; 120" dur="4.2s" begin="2.4s" repeatCount="indefinite" />
  </rect>

  <!-- Project Content -->
  <g id="project-content">
    <!-- Mono Label -->
    <text x="42" y="40" class="project-mono">PROJECT 04</text>

    <!-- Title -->
    <text x="42" y="72" class="project-title">Real Estate Website</text>

    <!-- Description -->
    <text x="42" y="97" class="project-desc">Property showcase platform featuring comprehensive listings, detail views, and direct inquiry channels.</text>

    <!-- Feature Chips (Row 1) - Sharp rectangular tags -->
    <g transform="translate(42, 126)">
      <!-- WhatsApp inquiry (Accent) -->
      <g transform="translate(0, 0)">
        <rect width="146" height="26" class="chip-accent" />
        <text x="73" y="14" class="chip-accent-text">WhatsApp Inquiry</text>
      </g>
      <!-- Property listings -->
      <g transform="translate(154, 0)">
        <rect width="134" height="26" class="chip-outline" />
        <text x="67" y="14" class="chip-text">Property Listings</text>
      </g>
      <!-- Property details -->
      <g transform="translate(296, 0)">
        <rect width="128" height="26" class="chip-outline" />
        <text x="64" y="14" class="chip-text">Property Details</text>
      </g>
      <!-- Direct calling -->
      <g transform="translate(432, 0)">
        <rect width="118" height="26" class="chip-outline" />
        <text x="59" y="14" class="chip-text">Direct Calling</text>
      </g>
    </g>
  </g>
</svg>
