name: Generate Contribution Snake

on:
  schedule:
    # Run once daily at midnight UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate contribution grid snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: mhdafsalt
          outputs: |
            dist/github-snake.svg?color_snake=%23F00016&color_dots=%23F4EEDF,%23D9D2BC,%23E57373,%23EF5350,%23F00016
            dist/github-snake-dark.svg?color_snake=%23FF4D5A&color_dots=%23181818,%232E2828,%238B0000,%23B22731,%23F00016

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
