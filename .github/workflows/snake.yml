name: Generate Contribution Snake

on:
  schedule:
    # Run once daily at midnight UTC
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate contribution grid snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: mhdafsalt
          outputs: |
            dist/github-snake.svg?color_snake=%232F5D3A&color_dots=%23F5F0E1,%23D9D2BC,%238EB89B,%233E7B4F,%232F5D3A
            dist/github-snake-dark.svg?color_snake=%238EB89B&color_dots=%2318261B,%23213B27,%232F5D3A,%233E7B4F,%238EB89B

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

